name: CI

on:
  pull_request:

jobs:
  lint-pr-title:
    name: Lint PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            test
            docs
            ci
            perf
            build

  ci:
    name: Typecheck / Unit Tests / Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm -r run typecheck

      - name: Unit tests (Vitest)
        run: pnpm -r run test --passWithNoTests

      - name: Lint (ESLint)
        run: pnpm -r run lint --pass-with-no-files

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Run after typecheck/lint pass — no point running E2E if the build is broken
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install --with-deps chromium

      - name: Start monolith stack (Docker Compose)
        run: |
          docker compose up -d postgres redis
          # Wait for postgres health
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 2; done'
          # Start monolith with test env vars
          NODE_ENV=test \
          SESSION_SECRET=ci-test-secret \
          DATABASE_URL=postgresql://monolith_svc:monolith_password@localhost:5432/affiliate_heaven \
          npm start &
          # Wait for monolith to be ready
          timeout 60 bash -c 'until curl -sf http://localhost:3000/; do sleep 2; done'

      - name: Run Playwright baseline tests
        working-directory: apps/e2e
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
