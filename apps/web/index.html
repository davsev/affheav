<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Affiliate Heaven</title>
    <script>
      // Mantine ColorSchemeScript equivalent for SPA — sets data attribute before React mounts
      (function() {
        var stored = localStorage.getItem('mantine-color-scheme') || 'dark';
        document.documentElement.setAttribute('data-mantine-color-scheme', stored);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
