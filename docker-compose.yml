services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: affiliate_heaven
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Per-service passwords — read by docker/postgres/01-init.sh
      MONOLITH_DB_PASSWORD: ${MONOLITH_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
      SUBJECTS_DB_PASSWORD: ${SUBJECTS_DB_PASSWORD}
      PRODUCTS_DB_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      AI_WRITER_DB_PASSWORD: ${AI_WRITER_DB_PASSWORD}
      CHANNELS_DB_PASSWORD: ${CHANNELS_DB_PASSWORD}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD}
      BROADCASTER_DB_PASSWORD: ${BROADCASTER_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  monolith:
    build:
      context: .
      dockerfile: apps/monolith/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://monolith_svc:${MONOLITH_DB_PASSWORD}@postgres:5432/affiliate_heaven
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
